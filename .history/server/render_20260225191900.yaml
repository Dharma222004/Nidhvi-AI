services:
  - type: web
    name: healthcare-report-explainer-server
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    env: static
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-frontend-deployment.com # User will need to update this
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: MAX_PAGES_PER_REPORT
        value: 10
